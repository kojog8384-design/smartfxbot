kind = "api"
previewPath = "/"
title = "Telegram Trading Bot"
version = "1.0.0"

[[services]]
localPort = 6000
name = "Telegram Trading Bot"
paths = ["/"]

[services.development]
run = "python3 artifacts/telegram-bot/bot.py"

[services.production]

[services.production.run]
args = ["/home/runner/workspace/.pythonlibs/bin/python3", "artifacts/telegram-bot/bot.py"]

[services.production.run.env]
PORT = "6000"

[services.production.health.startup]
path = "/health"
